name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar ícone
        run: |
          pip install pillow
          if curl -fsSL "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://totalgarantidora.com.br&size=256" -o icon.png; then
            python scripts/gerar_icones.py
          else
            echo "::warning::Nao foi possivel baixar o icone"
          fi

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: painel-total-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
